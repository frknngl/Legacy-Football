version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: fm_database
    environment:
      POSTGRES_USER: fm_admin
      POSTGRES_PASSWORD: fm_password
      POSTGRES_DB: fm_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
